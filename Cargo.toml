[package]
name = "tube"
version = "0.1.0"
edition = "2024"
description = "Client YouTube natif et léger pour Windows"
license = "MIT"

[[bin]]
name = "tube"
path = "src/main.rs"

[dependencies]
socle = { git = "https://github.com/Desarrh/socle", tag = "v0.1.6", default-features = false, features = ["ui", "settings", "crash", "instance", "testmode"] }
egui = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links"] }
winit = "0.30.13"
softbuffer = "0.4.8"
hdrshot-egui-backend = "0.2.0"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
dirs = "7.0.0"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
sha1_smol = "1"
sha2 = "0.10"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_Media_MediaFoundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus",
  "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_RestartManager",
  "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_Power", "Win32_Storage_Xps", "Win32_Media_Audio", "Win32_System_WinRT", "Media", "Foundation", "Storage_Streams",
  "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Storage_FileSystem",
] }
windows-core = "0.62"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3

[build-dependencies]
winresource = "0.1.34"
